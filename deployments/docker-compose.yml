name: iam

services:
  # Go 后端 API 服务，提供 IAM 接口
  backend:
    build:
      context: ../iam-go
      dockerfile: build/Dockerfile
    image: iam-backend:latest
    container_name: iam-backend
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - iam-net
    depends_on:
      - mysql
      - redis

  # MySQL 8 数据库，持久化用户/角色/权限等业务数据
  mysql:
    image: mysql:8
    container_name: iam-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - iam-net

  # Redis 7 缓存，用于 session、token、限流等
  redis:
    image: redis:7-alpine
    container_name: iam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - iam-net

  # React 前端单页应用，由内部 nginx 托管静态资源
  frontend:
    build:
      context: ../iam-web
      dockerfile: build/Dockerfile
    image: iam-frontend:latest
    container_name: iam-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - iam-net
    depends_on:
      - backend

  # 外层 nginx 反向代理，负责 HTTPS 入口和路由分发
  nginx:
    image: nginx:alpine
    container_name: iam-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./nginx/certs/server.key:/etc/nginx/certs/server.key:ro
    networks:
      - iam-net
    depends_on:
      - backend
      - frontend

networks:
  iam-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data: